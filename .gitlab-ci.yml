# hotstaq — GitLab CI/CD Pipeline
# Mirrors CircleCI build logic: build + test on dev and main, publish to npm on main only.
# Requires NPM_TOKEN set as a GitLab CI/CD variable.

stages:
  - build
  - publish

build:
  stage: build
  image: node:22-bookworm
  script:
    - npm ci
    - npx turbo run build
    - npx turbo run buildweb
    - npm run version-check
  artifacts:
    paths:
      - build/
      - build-web/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^feat\//'

# HS090-20 dual-mode compatibility gate — every commit must keep SSR
# behaviour and v0.9.0 static-build behaviour both green. Runs on every
# pushed branch, not just dev/main.
#
# Scope: hott/* tests only. This is the fast, focused dual-mode gate and is
# kept as its own job so a regression there is obvious at a glance. The full
# suite (test-full, below) also covers these, but this gate stays intact.
test:
  stage: build
  image: node:22-bookworm
  script:
    - npm ci
    - npm run build
    - npx mocha --timeout 30000 --colors './build/tests/hott/*.js'
  artifacts:
    when: on_failure
    paths:
      - build/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Full test suite (`npm test`). Runs every unit/API/generator/hott suite in a
# plain headless node container. Tests that require external infrastructure not
# present in CI are guarded (see tests/TestEnv.ts) and skip cleanly here:
#
#   - Browser/Selenium tests   -> set RUN_BROWSER_TESTS=1 with Chrome available
#   - Database tests (MySQL/PG/Influx) -> set RUN_DB_TESTS=1 with a DB available
#   - App-generation/Docker tests      -> set RUN_INTEGRATION_TESTS=1
#
# With none of those flags set, the gated suites report as pending and the job
# is green. The 60s mocha timeout accommodates runtime TypeScript interface
# parsing (convertInterfaceToRouteParameters), which takes several seconds.
test-full:
  stage: build
  image: node:22-bookworm
  script:
    - npm ci
    - npm run build
    - npm test
  artifacts:
    when: on_failure
    paths:
      - build/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH'

publish:
  stage: publish
  image: node:22-bookworm
  dependencies:
    - build
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm ci --ignore-scripts
    - npm publish --ignore-scripts
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
